name: reproduce

on:
  schedule:
    - cron: "41 5 * * 1"   # Mondays; change it
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ogasurfproject-jpg/horizon-shield
          ref: d9b3075928ab0ef41f1a9b6b6970887c18b4fb44
          path: upstream
          sparse-checkout: |
            workers/hs-ledger/nenrin/a2a-python-e2e-v0
            workers/hs-ledger/nenrin/sdk
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: install the published verifiers
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
      - name: recompute
        run: UPSTREAM=upstream OUT=receipt.json bash reproduce.sh
      - name: preserve receipt and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nenrin-reproduction-receipt
          path: |
            receipt.json
            logs/
            requirements.lock
          retention-days: 90
          if-no-files-found: error
  attest:
    needs: reproduce
    if: always() && needs.reproduce.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: nenrin-reproduction-receipt
          path: evidence
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: evidence/receipt.json
